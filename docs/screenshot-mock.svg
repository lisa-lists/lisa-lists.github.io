<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LISA// checklist UI mockup showing an expanded category with severity badges, flags and progress rings">
  <defs>
    <linearGradient id="ring1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#33D6C0"/>
      <stop offset="100%" stop-color="#1E8577"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="760" rx="14" fill="#0A0E12"/>
  <rect x="0.5" y="0.5" width="1199" height="759" rx="14" fill="none" stroke="#212B34"/>

  <!-- window chrome -->
  <circle cx="34" cy="32" r="6" fill="#FF4D6A"/>
  <circle cx="56" cy="32" r="6" fill="#FF9A63"/>
  <circle cx="78" cy="32" r="6" fill="#52D273"/>
  <text x="600" y="37" text-anchor="middle" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="12" letter-spacing="1" fill="#5D707E">you.github.io/lisa-checklist</text>

  <!-- topbar -->
  <rect x="0" y="56" width="1200" height="58" fill="#0D1319"/>
  <line x1="0" y1="114" x2="1200" y2="114" stroke="#212B34"/>
  <text x="40" y="92" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="18" font-weight="700" fill="#E7EDF2">LISA<tspan fill="#33D6C0">//</tspan></text>
  <rect x="170" y="70" width="520" height="30" rx="8" fill="#10161C" stroke="#212B34"/>
  <text x="186" y="90" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="12" fill="#5D707E">Search 20,200 test cases…</text>
  <rect x="900" y="70" width="88" height="30" rx="15" fill="#10161C" stroke="#212B34"/>
  <circle cx="916" cy="85" r="3.5" fill="#5D707E"/>
  <text x="928" y="89" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="10.5" fill="#8CA0AF">ALL SEV</text>
  <rect x="998" y="70" width="66" height="30" rx="15" fill="#10161C" stroke="#212B34"/>
  <circle cx="1014" cy="85" r="3.5" fill="#FF9A63"/>
  <text x="1026" y="89" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="10.5" fill="#8CA0AF">ALL</text>
  <circle cx="1100" cy="85" r="17" fill="#10161C" stroke="#212B34"/>

  <!-- sidebar -->
  <rect x="0" y="114" width="260" height="646" fill="#0A0E12"/>
  <line x1="260" y1="114" x2="260" y2="760" stroke="#212B34"/>
  <text x="24" y="146" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="10" letter-spacing="1.5" fill="#5D707E">ENGAGEMENT</text>
  <rect x="24" y="156" width="150" height="26" rx="6" fill="#10161C" stroke="#212B34"/>
  <text x="34" y="173" font-family="Inter,sans-serif" font-size="11" fill="#E7EDF2">acme-corp-2026</text>
  <rect x="180" y="156" width="24" height="26" rx="6" fill="#10161C" stroke="#212B34"/>
  <text x="192" y="174" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#8CA0AF">+</text>

  <g font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="10" letter-spacing="1.2" fill="#5D707E">
    <text x="24" y="222">IDENTITY &amp; ACCESS</text>
  </g>
  <g font-family="Inter,sans-serif" font-size="11.5">
    <rect x="16" y="234" width="228" height="30" rx="7" fill="#161D25"/>
    <circle cx="30" cy="249" r="4" fill="#33D6C0"/>
    <text x="42" y="240" font-family="ui-monospace,monospace" font-size="9" fill="#33D6C0">01</text>
    <text x="42" y="253" fill="#E7EDF2">Authentication</text>
    <rect x="24" y="270" width="212" height="24" rx="6" fill="none"/>
    <circle cx="30" cy="284" r="4" fill="#5D707E"/>
    <text x="42" y="288" font-family="ui-monospace,monospace" font-size="9" fill="#5D707E">02</text>
    <text x="42" y="288" fill="#8CA0AF" dx="10">Session Management</text>
    <circle cx="30" cy="316" r="4" fill="#5D707E"/>
    <text x="42" y="320" font-family="ui-monospace,monospace" font-size="9" fill="#5D707E">03</text>
    <text x="52" y="320" fill="#8CA0AF">Authorization &amp; Access Control</text>
  </g>

  <!-- main content: expanded category card -->
  <g transform="translate(292,150)">
    <text font-family="Inter,sans-serif" font-size="22" font-weight="700" fill="#E7EDF2" y="16">Every attack surface has a checkbox.</text>
    <text font-family="Inter,sans-serif" font-size="12.5" fill="#8CA0AF" y="42">20,200 test cases across 75 categories in 7 attack-surface domains — tracked locally, never uploaded.</text>

    <!-- category card -->
    <g transform="translate(0,70)">
      <rect width="880" height="52" rx="10" fill="#10161C" stroke="#212B34"/>
      <text x="20" y="32" font-family="ui-monospace,monospace" font-size="12" fill="#33D6C0">01</text>
      <text x="52" y="27" font-family="Inter,sans-serif" font-size="14" font-weight="600" fill="#E7EDF2">Authentication</text>
      <text x="52" y="43" font-family="ui-monospace,monospace" font-size="10" fill="#5D707E">536 test cases · Identity &amp; Access</text>
      <circle cx="820" cy="26" r="16" fill="none" stroke="#1B232C" stroke-width="5"/>
      <circle cx="820" cy="26" r="16" fill="none" stroke="url(#ring1)" stroke-width="5" stroke-dasharray="100.5" stroke-dashoffset="38" transform="rotate(-90 820 26)"/>
      <text x="820" y="30" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#E7EDF2">62</text>
      <path d="M856 20 l8 8 8 -8" fill="none" stroke="#8CA0AF" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- methodology tip -->
    <g transform="translate(0,132)">
      <rect x="0" y="0" width="880" height="34" rx="8" fill="#0D1319"/>
      <rect x="14" y="8" width="52" height="17" rx="4" fill="none" stroke="#1E8577"/>
      <text x="40" y="20" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#33D6C0">METHOD</text>
      <text x="78" y="21" font-family="Inter,sans-serif" font-size="11" fill="#8CA0AF">Brute-force with Burp Intruder/ffuf against login, register, reset, and MFA endpoints…</text>
    </g>

    <!-- item rows -->
    <g transform="translate(0,178)" font-family="Inter,sans-serif" font-size="12.5">
      <!-- row 1 checked -->
      <g>
        <rect width="880" height="38" rx="7" fill="#0D1319"/>
        <rect x="14" y="9" width="20" height="20" rx="5" fill="rgba(255,77,106,.15)" stroke="#FF4D6A"/>
        <text x="24" y="23" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" font-weight="700" fill="#FF4D6A">C</text>
        <rect x="44" y="11" width="16" height="16" rx="4" fill="#33D6C0" stroke="#33D6C0"/>
        <path d="M48 19 l4 4 8 -8" fill="none" stroke="#0A0E12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="70" y="24" fill="#5D707E" text-decoration="line-through">Weak password policy allows dictionary-based brute force</text>
        <path d="M840 12 l3 7 7 1 -5 5 1 7 -6 -3 -6 3 1 -7 -5 -5 7 -1z" fill="#FF4D6A"/>
      </g>
      <!-- row 2 -->
      <g transform="translate(0,42)">
        <rect x="14" y="9" width="20" height="20" rx="5" fill="rgba(255,154,99,.15)" stroke="#FF9A63"/>
        <text x="24" y="23" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" font-weight="700" fill="#FF9A63">H</text>
        <rect x="44" y="11" width="16" height="16" rx="4" fill="none" stroke="#5D707E"/>
        <text x="70" y="24" fill="#E7EDF2">Account lockout threshold missing on OTP verification endpoint</text>
      </g>
      <!-- row 3 -->
      <g transform="translate(0,84)">
        <rect x="14" y="9" width="20" height="20" rx="5" fill="#10161C" stroke="#212B34"/>
        <text x="24" y="23" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#5D707E">—</text>
        <rect x="44" y="11" width="16" height="16" rx="4" fill="none" stroke="#5D707E"/>
        <text x="70" y="24" fill="#E7EDF2">Federated identity broker allows scope escalation via token replay</text>
      </g>
      <!-- row 4 with note -->
      <g transform="translate(0,126)">
        <rect x="14" y="9" width="20" height="20" rx="5" fill="rgba(232,197,71,.15)" stroke="#E8C547"/>
        <text x="24" y="23" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" font-weight="700" fill="#E8C547">M</text>
        <rect x="44" y="11" width="16" height="16" rx="4" fill="none" stroke="#5D707E"/>
        <text x="70" y="24" fill="#E7EDF2">Magic link endpoint does not expire after first use</text>
        <rect x="70" y="34" width="700" height="26" rx="6" fill="#10161C" stroke="#1F2932"/>
        <text x="80" y="51" font-family="ui-monospace,monospace" font-size="10" fill="#5D707E">note: confirmed on /auth/magic-link — reused 3x successfully, filing report</text>
      </g>
    </g>
  </g>
</svg>
