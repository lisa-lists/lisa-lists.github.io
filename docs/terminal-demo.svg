<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated terminal demo of the LISA search bar filtering test cases">
  <defs>
    <linearGradient id="tGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#35e0c4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#35e0c4" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="typeClip1">
      <rect x="0" y="0" width="0" height="24">
        <animate attributeName="width" values="0;0;196;196;196;196;196;0;0" keyTimes="0;0.02;0.16;0.40;0.42;0.58;0.60;0.62;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="typeClip2">
      <rect x="0" y="0" width="0" height="24">
        <animate attributeName="width" values="0;0;0;0;0;226;226;0;0" keyTimes="0;0.02;0.16;0.40;0.42;0.58;0.60;0.62;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="900" height="260" rx="14" fill="#0a0c11"/>
  <rect x="0.5" y="0.5" width="899" height="259" rx="14" fill="none" stroke="#242a38"/>
  <rect x="0" y="0" width="900" height="130" fill="url(#tGlow)"/>

  <!-- window chrome -->
  <circle cx="30" cy="28" r="6" fill="#ff4d6a"/>
  <circle cx="52" cy="28" r="6" fill="#ffb648"/>
  <circle cx="74" cy="28" r="6" fill="#4f5666"/>
  <text x="450" y="33" text-anchor="middle" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="12" letter-spacing="1" fill="#5a6275">lawxxz.github.io — LISA// v2</text>
  <line x1="0" y1="52" x2="900" y2="52" stroke="#242a38"/>

  <!-- search bar -->
  <rect x="32" y="76" width="836" height="42" rx="10" fill="#141822" stroke="#242a38"/>
  <circle cx="58" cy="97" r="7" fill="none" stroke="#5a6275" stroke-width="2"/>
  <line x1="63" y1="102" x2="69" y2="108" stroke="#5a6275" stroke-width="2" stroke-linecap="round"/>

  <text x="82" y="103" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="15" fill="#e7eaf1">
    <tspan clip-path="url(#typeClip1)">idor api v2</tspan>
    <tspan clip-path="url(#typeClip2)" dx="0" x="82">ssrf cloud metadata</tspan>
  </text>

  <!-- blinking cursor tied to typing -->
  <rect x="80" y="90" width="2" height="18" fill="#35e0c4">
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 196,0; 196,0; 0,0; 0,0; 226,0; 226,0; 0,0"
      keyTimes="0;0.16;0.40;0.42;0.58;0.60;0.62;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <text x="868" y="103" text-anchor="end" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="11" fill="#5a6275">/</text>

  <!-- result rows fading in -->
  <g font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="12.5">
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.18;0.30;0.55;0.62" dur="8s" repeatCount="indefinite"/>
      <rect x="32" y="136" width="836" height="30" rx="7" fill="#10131a"/>
      <rect x="44" y="144" width="22" height="14" rx="4" fill="rgba(255,77,106,.15)" stroke="#ff4d6a"/>
      <text x="55" y="155" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" font-weight="700" fill="#ff4d6a">P1</text>
      <text x="80" y="156" fill="#e7eaf1">IDOR on /api/v2/orders/{id} returns other tenants' invoices</text>

      <rect x="32" y="172" width="836" height="30" rx="7" fill="#10131a"/>
      <rect x="44" y="180" width="22" height="14" rx="4" fill="rgba(255,182,72,.15)" stroke="#ffb648"/>
      <text x="55" y="191" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" font-weight="700" fill="#ffb648">P2</text>
      <text x="80" y="192" fill="#e7eaf1">Sequential order IDs enumerable via bulk-export API endpoint</text>

      <rect x="32" y="208" width="836" height="30" rx="7" fill="#10131a"/>
      <rect x="44" y="216" width="22" height="14" rx="4" fill="rgba(255,77,106,.15)" stroke="#ff4d6a"/>
      <text x="55" y="227" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" font-weight="700" fill="#ff4d6a">P1</text>
      <text x="80" y="228" fill="#e7eaf1">GraphQL node(id:) resolver bypasses object-level authorization</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.60;0.72;0.96;1" dur="8s" repeatCount="indefinite"/>
      <rect x="32" y="136" width="836" height="30" rx="7" fill="#10131a"/>
      <rect x="44" y="144" width="22" height="14" rx="4" fill="rgba(255,77,106,.15)" stroke="#ff4d6a"/>
      <text x="55" y="155" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" font-weight="700" fill="#ff4d6a">P1</text>
      <text x="80" y="156" fill="#e7eaf1">SSRF in webhook URL validator reaches 169.254.169.254 metadata</text>

      <rect x="32" y="172" width="836" height="30" rx="7" fill="#10131a"/>
      <rect x="44" y="180" width="22" height="14" rx="4" fill="rgba(255,77,106,.15)" stroke="#ff4d6a"/>
      <text x="55" y="191" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" font-weight="700" fill="#ff4d6a">P1</text>
      <text x="80" y="192" fill="#e7eaf1">Chain: SSRF → IMDSv1 → temp creds → cross-account IAM pivot</text>

      <rect x="32" y="208" width="836" height="30" rx="7" fill="#10131a"/>
      <rect x="44" y="216" width="22" height="14" rx="4" fill="rgba(90,169,255,.15)" stroke="#5aa9ff"/>
      <text x="55" y="227" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" font-weight="700" fill="#5aa9ff">P3</text>
      <text x="80" y="228" fill="#e7eaf1">Cloud provider metadata endpoint reachable without IMDSv2 hop guard</text>
    </g>
  </g>
</svg>
