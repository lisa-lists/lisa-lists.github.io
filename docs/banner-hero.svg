<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LISA// v2 — Offensive Web Testing Manifest — 106,392 test cases across 180 categories, P1 to P3, web application scope only">
  <defs>
    <radialGradient id="glow" cx="26%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#35e0c4" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#35e0c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e7eaf1"/>
      <stop offset="100%" stop-color="#35e0c4"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#35e0c4"/>
      <stop offset="100%" stop-color="#1d7a6c"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <line x1="0" y1="0" x2="4" y2="0" stroke="#35e0c4" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="titleClip">
      <rect x="-4" y="-56" width="0" height="80">
        <animate attributeName="width" from="0" to="330" dur="1.1s" begin="0.15s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="#0a0c11"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#scan)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#242a38" stroke-width="1"/>

  <!-- moving scanline sweep across whole banner -->
  <rect x="0" y="-40" width="1200" height="40" fill="url(#glow)" opacity="0.5">
    <animate attributeName="y" values="-40;630;-40" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- corner ticks -->
  <g stroke="#35e0c4" stroke-opacity="0.5" stroke-width="2">
    <path d="M24 48 V24 H48"/>
    <path d="M1152 24 H1176 V48"/>
    <path d="M24 582 V606 H48"/>
    <path d="M1176 582 V606 H1152"/>
  </g>

  <!-- top label row -->
  <text x="48" y="70" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="13" letter-spacing="3" fill="#5a6275">FOR AUTHORIZED BUG BOUNTY &amp; WHITEBOX ENGAGEMENTS ONLY</text>
  <circle cx="1160" cy="65" r="4" fill="#35e0c4">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="1140" y="70" text-anchor="end" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="12" letter-spacing="2" fill="#35e0c4">v2 · LIVE</text>

  <!-- radar target -->
  <g transform="translate(230,335)">
    <circle r="176" fill="url(#glow)"/>
    <g stroke="#242a38" stroke-width="1">
      <circle r="150" fill="none"/>
      <circle r="85" fill="none"/>
    </g>
    <g stroke="#35e0c4" stroke-opacity="0.55">
      <line x1="-24" y1="0" x2="24" y2="0"/>
      <line x1="0" y1="-24" x2="0" y2="24"/>
    </g>
    <g stroke="#35e0c4" stroke-opacity="0.35" stroke-width="2">
      <line x1="0" y1="-162" x2="0" y2="-172"/>
      <line x1="81" y1="-140.4" x2="86" y2="-149"/>
      <line x1="140.4" y1="-81" x2="149" y2="-86"/>
      <line x1="162" y1="0" x2="172" y2="0"/>
      <line x1="140.4" y1="81" x2="149" y2="86"/>
      <line x1="81" y1="140.4" x2="86" y2="149"/>
      <line x1="0" y1="162" x2="0" y2="172"/>
      <line x1="-81" y1="140.4" x2="-86" y2="149"/>
      <line x1="-140.4" y1="81" x2="-149" y2="86"/>
      <line x1="-162" y1="0" x2="-172" y2="0"/>
      <line x1="-140.4" y1="-81" x2="-149" y2="-86"/>
      <line x1="-81" y1="-140.4" x2="-86" y2="-149"/>
    </g>

    <!-- rotating radar sweep -->
    <g opacity="0.85">
      <path d="M0 0 L0 -172 A172 172 0 0 1 55 -163 Z" fill="#35e0c4" opacity="0.18">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- progress ring, loops so it always reads "live" -->
    <circle r="150" fill="none" stroke="#1c212c" stroke-width="7"/>
    <circle r="150" fill="none" stroke="url(#ringGrad)" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="942.5" transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" values="942.5;0;942.5" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- severity blips -->
    <circle cx="0" cy="-198" r="5.5" fill="#35e0c4"/>
    <circle cx="171.5" cy="-99" r="4.5" fill="#ff4d6a" opacity="0.85"/>
    <circle cx="171.5" cy="99" r="5" fill="#ffb648" opacity="0.9"/>
    <circle cx="0" cy="198" r="4" fill="#5aa9ff" opacity="0.85"/>
    <circle cx="-171.5" cy="99" r="5.5" fill="#5aa9ff"/>
    <circle cx="-171.5" cy="-99" r="4.5" fill="#ff4d6a" opacity="0.8"/>

    <text x="0" y="-14" text-anchor="middle" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="46" font-weight="700" fill="#e7eaf1">180</text>
    <text x="0" y="18" text-anchor="middle" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="14" letter-spacing="3" fill="#5a6275">CATEGORIES</text>
  </g>

  <!-- title block -->
  <g transform="translate(470,190)">
    <g clip-path="url(#titleClip)">
      <text x="0" y="0" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="64" font-weight="700" fill="url(#titleFade)">LISA<tspan fill="#35e0c4">//</tspan></text>
    </g>
    <!-- blinking cursor -->
    <rect x="332" y="-52" width="6" height="58" fill="#35e0c4">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" begin="1.25s" repeatCount="indefinite"/>
    </rect>

    <text x="4" y="42" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="19" letter-spacing="1" fill="#8b93a8" opacity="0">
      Offensive Web Testing Manifest — v2 rebuild
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.3s" fill="freeze"/>
    </text>

    <!-- stat chips, staggered fade+rise -->
    <g transform="translate(4,84)" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace">
      <g opacity="0">
        <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="0.5s" begin="1.5s" fill="freeze"/>
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.5s" fill="freeze"/>
        <rect width="192" height="64" rx="10" fill="#10131a" stroke="#242a38"/>
        <text x="16" y="28" font-size="24" font-weight="700" fill="#e7eaf1">106,392</text>
        <text x="16" y="47" font-size="10.5" letter-spacing="1.5" fill="#5a6275">TEST CASES</text>
      </g>
      <g transform="translate(204,0)" opacity="0">
        <animateTransform attributeName="transform" type="translate" from="204 14" to="204 0" dur="0.5s" begin="1.65s" fill="freeze"/>
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.65s" fill="freeze"/>
        <rect width="150" height="64" rx="10" fill="#10131a" stroke="#242a38"/>
        <text x="16" y="28" font-size="24" font-weight="700" fill="#ff4d6a">48,544</text>
        <text x="16" y="47" font-size="10.5" letter-spacing="1.5" fill="#5a6275">P1 CRITICAL</text>
      </g>
      <g transform="translate(370,0)" opacity="0">
        <animateTransform attributeName="transform" type="translate" from="370 14" to="370 0" dur="0.5s" begin="1.8s" fill="freeze"/>
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.8s" fill="freeze"/>
        <rect width="150" height="64" rx="10" fill="#10131a" stroke="#242a38"/>
        <text x="16" y="28" font-size="24" font-weight="700" fill="#35e0c4">15</text>
        <text x="16" y="47" font-size="10.5" letter-spacing="1.5" fill="#5a6275">ATTACK CHAINS</text>
      </g>
    </g>

    <!-- severity legend -->
    <g transform="translate(4,182)" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="11.5" letter-spacing="0.5" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.05s" fill="freeze"/>
      <g fill="#8b93a8">
        <circle cx="4" cy="0" r="4" fill="#ff4d6a"/><text x="14" y="4">P1 · Critical · 48,544</text>
        <circle cx="184" cy="0" r="4" fill="#ffb648"/><text x="194" y="4">P2 · High · 35,449</text>
        <circle cx="354" cy="0" r="4" fill="#5aa9ff"/><text x="364" y="4">P3 · Medium · 22,399</text>
      </g>
    </g>
  </g>

  <!-- bottom bar -->
  <text x="48" y="590" font-family="ui-monospace,'IBM Plex Mono',Menlo,monospace" font-size="12" letter-spacing="1.5" fill="#5a6275">100% STATIC · NO BACKEND · NO TELEMETRY · RUNS ENTIRELY IN YOUR BROWSER</text>
</svg>
